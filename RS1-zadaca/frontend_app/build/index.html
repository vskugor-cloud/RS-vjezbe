<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popis zadataka</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    li { margin: 8px 0; }
    .status { color: #555; font-size: 14px; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Popis zadataka</h1>
  <p id="status" class="status"></p>

  <button id="healthBtn">Provjeri server</button>
  <button id="loadBtn">Učitaj stavke</button>

  <h2>Dodaj novu stavku</h2>
  <form id="addForm">
    <input type="text" id="nameInput" placeholder="Naziv zadatka" required>
    <button type="submit">Dodaj</button>
  </form>

  <ul id="list"></ul>

  <script>
    const API_URL = "https://backend-rs-webservis.onrender.com";

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? "status error" : "status";
    }

    async function checkHealth() {
      setStatus("Provjeravam server...");
      try {
        const res = await fetch(`${API_URL}/api/health`);
        const data = await res.json();
        setStatus(`Server je ${data.status}`);
      } catch (err) {
        setStatus("Server nije dostupan. Pokušajte ponovno za minutu (besplatni plan se uspava).", true);
      }
    }

    async function loadItems() {
      setStatus("Učitavam stavke...");
      try {
        const res = await fetch(`${API_URL}/api/items`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const items = await res.json();
        renderItems(items);
        setStatus(`Učitano stavki: ${items.length}`);
      } catch (err) {
        setStatus(`Greška pri učitavanju: ${err.message}`, true);
      }
    }

    function renderItems(items) {
      listEl.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = `${item.id}. ${item.name} `;

        const delBtn = document.createElement("button");
        delBtn.textContent = "Obriši";
        delBtn.addEventListener("click", () => deleteItem(item.id));

        li.appendChild(delBtn);
        listEl.appendChild(li);
      }
    }

    async function addItem(name) {
      setStatus("Dodajem stavku...");
      try {
        const res = await fetch(`${API_URL}/api/items`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error);
        }
        setStatus("Stavka dodana");
        await loadItems();
      } catch (err) {
        setStatus(`Greška pri dodavanju: ${err.message}`, true);
      }
    }

    async function deleteItem(id) {
      setStatus("Brišem stavku...");
      try {
        const res = await fetch(`${API_URL}/api/items/${id}`, { method: "DELETE" });
        if (!res.ok && res.status !== 204) throw new Error(`HTTP ${res.status}`);
        setStatus("Stavka obrisana");
        await loadItems();
      } catch (err) {
        setStatus(`Greška pri brisanju: ${err.message}`, true);
      }
    }

    document.getElementById("healthBtn").addEventListener("click", checkHealth);
    document.getElementById("loadBtn").addEventListener("click", loadItems);
    document.getElementById("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("nameInput").value.trim();
      if (name) {
        addItem(name);
        e.target.reset();
      }
    });

    loadItems();
  </script>
</body>
</html>
