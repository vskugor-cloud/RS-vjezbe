<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator paleta boja</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
    }
    h1 { margin: 0 0 0.25rem; }
    header p { margin: 0 0 1rem; color: #aaa; }

    #generate {
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #generate:hover { background: #ddd; }

    #palette {
      flex: 1;
      display: flex;
    }

    .swatch {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
      padding: 2rem 0.5rem;
      transition: background 0.25s;
    }
    .swatch.light { color: #111; }
    .swatch.dark  { color: #fff; }

    .swatch button {
      border: none;
      background: rgba(128, 128, 128, 0.25);
      color: inherit;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .swatch button:hover { background: rgba(128, 128, 128, 0.45); }
    .hex {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 1.1rem !important;
      font-weight: 700;
    }

    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #fff;
      color: #111;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Na mobitelu boje idu jedna ispod druge */
    @media (max-width: 600px) {
      #palette { flex-direction: column; }
      .swatch { flex-direction: row; justify-content: space-between; padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Generator paleta boja</h1>
    <p>Pritisni razmaknicu ili gumb. Klikni hex kod za kopiranje, a lokot za zaključavanje boje.</p>
    <button id="generate">Generiraj paletu</button>
  </header>

  <main id="palette"></main>
  <div id="toast"></div>

  <script>
    const COUNT = 5;
    const paletteEl = document.getElementById('palette');
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function randomHex() {
      const n = Math.floor(Math.random() * 0xffffff);
      return '#' + n.toString(16).padStart(6, '0').toUpperCase();
    }

    // Procjena svjetline da tekst na boji ostane čitljiv
    function isLight(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 > 150;
    }

    let colors = Array.from({ length: COUNT }, () => ({
      hex: randomHex(),
      locked: false,
    }));

    function render() {
      paletteEl.innerHTML = '';

      colors.forEach((color) => {
        const swatch = document.createElement('div');
        swatch.className = 'swatch ' + (isLight(color.hex) ? 'light' : 'dark');
        swatch.style.background = color.hex;

        const hexBtn = document.createElement('button');
        hexBtn.className = 'hex';
        hexBtn.textContent = color.hex;
        hexBtn.addEventListener('click', () => copyToClipboard(color.hex));

        const lockBtn = document.createElement('button');
        lockBtn.textContent = color.locked ? '🔒 Zaključano' : '🔓 Zaključaj';
        lockBtn.addEventListener('click', () => {
          color.locked = !color.locked;
          render();
        });

        swatch.append(hexBtn, lockBtn);
        paletteEl.append(swatch);
      });
    }

    function generate() {
      colors.forEach((color) => {
        if (!color.locked) color.hex = randomHex();
      });
      render();
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('Kopirano: ' + text);
      } catch {
        showToast('Kopiranje nije uspjelo');
      }
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    document.getElementById('generate').addEventListener('click', generate);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        document.activeElement.blur(); // da razmaknica ne "klikne" fokusirani gumb
        generate();
      }
    });

    render();
  </script>
</body>
</html>
